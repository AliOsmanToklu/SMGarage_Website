services:
  web:
    build:
      context: .
      target: runtime
    image: smgarage-web:local
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

networks:
  web:
    driver: bridge
