server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS and HTTP-to-HTTPS redirects are handled by the AWS load balancer.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        # A live server without the built entry point cannot serve the application.
        if (!-f $document_root/index.html) { return 503; }
        return 200 "ok\n";
    }

    # Vite fingerprints production assets. Do not serve index.html for missing assets.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    # Internal error handling preserves the original 404 status.
    location = /404.html {
        internal;
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
