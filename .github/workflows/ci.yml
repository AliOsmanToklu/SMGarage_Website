name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start container
        run: docker compose up -d --build
      - name: Verify health and routing
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/healthz | grep -qx 'ok'
          curl --fail --silent http://127.0.0.1:8080/ | grep -q '<div id="root">'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/not-a-page)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/assets/missing.js)" = 404
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q web)")
            if [ "$status" = healthy ]; then break; fi
            sleep 2
          done
          test "$status" = healthy
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans
