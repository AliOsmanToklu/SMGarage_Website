<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#101315">
  <title>Sayfa bulunamadı | SM Garage</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101315; color: #f2f3f5; font-family: "Segoe UI", Arial, sans-serif; line-height: 1.6; }
    .wrap { width: min(100% - 40px, 1100px); margin: 0 auto; }
    header { border-bottom: 1px solid #394244; padding: 26px 0; }
    .brand { color: #f2f3f5; font-weight: 800; letter-spacing: .1em; text-decoration: none; }
    main { padding: clamp(80px, 16vh, 160px) 0; max-width: 720px; }
    .code { color: #ffb477; font-size: .9rem; font-weight: 700; letter-spacing: .18em; }
    h1 { font-family: Impact, "Arial Narrow", sans-serif; font-size: clamp(3rem, 9vw, 6.5rem); line-height: 1.05; font-weight: 400; margin: 22px 0; text-transform: uppercase; }
    p { max-width: 50ch; color: #d3d8d9; font-size: 1.1rem; margin: 0 0 32px; }
    .button { display: inline-block; padding: 15px 24px; border-radius: 4px; background: #a52f26; color: #fff; font-weight: 700; text-decoration: none; }
    .button:hover { background: #83231d; }
    a:focus-visible { outline: 3px solid #ffbf88; outline-offset: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header><a class="brand" href="/">SM GARAGE</a></header>
    <main>
      <span class="code">404 / SAYFA BULUNAMADI</span>
      <h1>Bu sayfaya ulaşılamıyor.</h1>
      <p>Adres değişmiş veya yanlış yazılmış olabilir. Ana sayfaya dönerek hizmetlerimizi ve iletişim bilgilerimizi bulabilirsiniz.</p>
      <a class="button" href="/">Ana sayfaya dön</a>
    </main>
  </div>
</body>
</html>
